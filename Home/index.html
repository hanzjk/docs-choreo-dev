<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to Choreo Documentation</title>

    <style>
      :root {
        --md-text-font-family: "Montserrat", sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #f7f8fb;
        font-family: var(--md-text-font-family);
      }

      .modal {
        background: white;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 500px;
        width: 90%;
      }

      .modal h1 {
        font-size: 1.5rem;
        font-weight: 600;
        color: #333;
      }

      .modal p {
        font-size: 0.9rem;
        color: #666;
        margin-bottom: 1.5rem;
      }

      .persona-card {
        display: flex;
        align-items: center;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        margin-bottom: 1rem;
        cursor: pointer;
        transition: background 0.2s ease-in-out;
      }

      .persona-card:hover {
        background: #f0f4ff;
      }

      .persona-card img {
        width: 40px;
        margin-right: 12px;
      }

      .persona-card div {
        text-align: left;
      }

      .persona-card p {
        margin: 0;
      }

      .persona-title {
        font-weight: bold;
        color: #333;
      }

      .persona-desc {
        font-size: 0.8rem;
        color: #555;
      }

      .next-btn {
        background: #545cec;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
        transition: background 0.2s ease-in-out;
      }

      .next-btn:hover {
        background: #4242d6;
      }
    </style>

    <script>
      function navigateToDocs(version) {
        window.location.href = `/${version}/`;
      }
    </script>
  </head>
  <body>
    <div class="modal">
      <h1>Get Started with Choreo Documentation</h1>
      <p>Select your persona to find the right documentation for you</p>

      <div class="persona-card" onclick="navigateToDocs('Developer')">
        <div>
          <p class="persona-title">Developer / Architect</p>
          <p class="persona-desc">
            Building, testing, and deploying applications.
          </p>
        </div>
      </div>

      <div class="persona-card" onclick="navigateToDocs('Platform Engineer')">
        <div>
          <p class="persona-title">Platform Engineer / SRE</p>
          <p class="persona-desc">
            Infrastructure, governance, service mesh, and monitoring.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
