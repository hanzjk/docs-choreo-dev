echo '<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Documentation</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        button { margin: 10px; padding: 15px 30px; font-size: 18px; cursor: pointer; }
    </style>
    <script>
        function navigateToDocs(version) {
            window.location.href = `/${version}/`;
        }
    </script>
</head>
<body>
    <h1>Select Documentation Version</h1>
    <button onclick="navigateToDocs(\'developer\')">Developer</button>
    <button onclick="navigateToDocs(\'pe\')">Platform Engineer</button>
</body>
</html>' > docs/en/landing/docs/index.html
